name: Deploy website

# The public website (site/ → the globeskimmers-site Worker). Its own workflow
# so a copy edit never redeploys the API worker (deploy-workers.yml is not
# path-conditioned per job).
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'wrangler-site.toml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  deploy-site:
    name: Deploy globeskimmers-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy static assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Without a pin the action installs Wrangler 3.90.0, which uploads
          # site/_redirects and site/_headers as plain files instead of applying them.
          wranglerVersion: '4.131.2'
          command: deploy --config wrangler-site.toml

      # /legal/* on the live domain is served by the API worker from R2 (a
      # Base44-era relic route) — NOT by this site worker. Keep both copies in
      # lockstep or policy edits silently never go live (found 2026-10-01 after
      # a day of "successful" deploys serving week-old privacy copy). Retire
      # this step only after the dashboard route for /legal/* is removed.
      - name: Sync legal pages to the API worker's R2 copies
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.131.2'
          command: |
            r2 object put globeskimmers-media/legal/privacy.html --file=site/legal/privacy.html --content-type="text/html; charset=utf-8" --remote
            r2 object put globeskimmers-media/legal/terms.html --file=site/legal/terms.html --content-type="text/html; charset=utf-8" --remote
