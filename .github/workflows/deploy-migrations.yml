name: Apply Supabase Migrations

# Database migrations are NOT like the worker deploy: a bad one can be
# irreversible. So this workflow is deliberately gated —
#   * it only fires on changes under supabase/migrations/
#   * it prints the plan (--dry-run) before applying anything
#   * it runs in the `production` GitHub Environment, so you can require a
#     manual approval in Settings → Environments → production → required reviewers
#
# Secrets needed (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token, from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — the database password for the linked project
#
# The project ref is not a secret (it is already public in the client bundle).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: bkaxadiyehddzkiuheea

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what would be applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
