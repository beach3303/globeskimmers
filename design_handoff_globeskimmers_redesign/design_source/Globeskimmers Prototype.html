<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Globeskimmers — Clickable Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
:root{
  --serif:"Instrument Serif", Georgia, serif;
  --sans:"Inter Tight", ui-sans-serif, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --ink:#0F1419;
  --ink-2:#3A3128;
  --ink-3:#6B6055;
  --teal:#0E7C73;
  --rule:rgba(15,20,25,.08);
  --rule-strong:rgba(15,20,25,.16);
  --ivory:#FFFCF7;
  --ivory-2:#F7F4EC;
}
html,body{margin:0;padding:0;background:#0E1518;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}

.stage{
  min-height: 100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(94,230,196,.06) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(244,114,182,.05) 0%, transparent 50%),
    #0E1518;
  padding: 24px 16px;
  gap: 16px;
}
.stage-title{
  color: #EDE6D8; font-family: var(--serif); font-size: 22px; font-style: italic; letter-spacing: -.01em;
  text-align:center;
}
.stage-hint{
  color: rgba(237,230,216,.5); font-size: 12px; font-family: var(--mono); letter-spacing:.14em; text-transform:uppercase; text-align:center;
}
</style>
</head>
<body>

<div id="root">
  <div class="boot">
    <div class="boot-orb"></div>
    <div class="boot-text">Globeskimmers</div>
    <div class="boot-hint">Compiling prototype…</div>
  </div>
</div>

<style>
.boot{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 14px; color:#EDE6D8 }
.boot-orb{ width: 72px; height: 72px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #5EE6C4 0%, #0E7C73 70%);
  box-shadow: 0 0 80px rgba(94,230,196,.35);
  animation: pulse 1.6s ease-in-out infinite; }
.boot-text{ font-family: var(--serif); font-style: italic; font-size: 28px; letter-spacing: -.01em; }
.boot-hint{ font-family: var(--mono); font-size: 11px; letter-spacing:.18em; text-transform:uppercase; color: rgba(237,230,216,.55); }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(.92); opacity: .8 } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(async () => {
  const token = new URLSearchParams(location.search).get("t");
  const q = token ? "?t=" + token : "";
  async function load(path) {
    const r = await fetch(path + q, { credentials: "include" });
    if (!r.ok) throw new Error(path + " → " + r.status);
    const src = await r.text();
    const { code } = Babel.transform(src, { presets: ["react"], filename: path });
    const s = document.createElement("script"); s.text = code; document.body.appendChild(s);
  }
  try {
    for (const f of [
      "ios-frame.jsx",
      "redesign-system.jsx",
      "redesign-bold.jsx",
      "redesign-home-variations.jsx",
      "redesign-home-final.jsx",
      "redesign-more-screens.jsx",
      "redesign-proto.jsx",
    ]) await load(f);
  } catch (e) {
    document.body.insertAdjacentHTML("beforeend",
      `<pre style="padding:20px;color:#fff;font-family:monospace;white-space:pre-wrap">${e.stack || e.message}</pre>`);
  }
})();
</script>

</body>
</html>
