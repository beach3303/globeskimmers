name = "globeskimmers-api"
main = "cloudflare-worker-v7.12.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "GLOBESKIMMERS_KV"
id = "68ae9c62099f4834a8c6f0ff3eb57e71"

# ── D1 ANALYTICS BINDING (P3 — provisioned 2026-05-27) ───────────────────
# Binding name MUST be "DB" to match the Worker code at handleLogEvent
# (env.DB.prepare(...) / env.DB.run()).
# Database id from `wrangler d1 create globeskimmers-events`.
[[d1_databases]]
binding = "DB"
database_name = "globeskimmers-events"
database_id = "e059428f-87ce-400f-9b82-159ac601b382"

# ── D1 ATTRACTIONS BINDING ──────────────────────────────────────────────
# Read-mostly seed database for ThingsToDo: ~360 hand-curated marquee
# attractions across 25 launch cities + 25 launch countries. Powers the
# /attractions/nearby endpoint that replaces the previous 30s-of-Places-
# calls cold-load path with a single bounding-box D1 query (~50ms).
#
# To provision (one-time, on the Mac):
#   1. wrangler d1 create globeskimmers-attractions
#      → copy the database_id from the output and paste below
#   2. wrangler d1 execute globeskimmers-attractions \
#          --file=cloudflare-worker/sql/schema.sql --remote
#   3. wrangler d1 execute globeskimmers-attractions \
#          --file=cloudflare-worker/sql/seed_attractions.sql --remote
#   4. wrangler deploy
#
# Binding name MUST be "ATTRACTIONS_DB" — matches handleAttractionsNearby
# in cloudflare-worker-v7.12.js. See cloudflare-worker/README_D1_ATTRACTIONS.md
# for the full setup guide.
[[d1_databases]]
binding = "ATTRACTIONS_DB"
database_name = "globeskimmers-attractions"
database_id = "f27d0c24-786b-4422-b0bb-e19e8b7c70c6"

# ── R2 MEDIA BINDING (guestbook / crowdsourced photos) ──────────────────
# Stores user-uploaded guestbook photos (food, drinks, places). Zero-egress —
# served back through the Worker at GET /gb-photo/<key>, cached at the edge.
# One-time provisioning (on the Mac):
#   wrangler r2 bucket create globeskimmers-media
#   wrangler deploy
# Binding name MUST be "MEDIA" — matches handleGuestbookPhotoUpload/Serve.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "globeskimmers-media"

# Your GOOGLE_API_KEY is already set as a secret in Cloudflare
# If you need to update it: wrangler secret put GOOGLE_API_KEY

# ── NUITEE CONNECT (LiteAPI) hotel lane ─────────────────────────────────────
# Which key the hotel lane uses: "sandbox" → NUITEE_SANDBOX_KEY (test inventory,
# simulated payments) · anything else → NUITEE_API_KEY (real bookings).
# Flip to "production" when the in-app hotel lane goes live to travelers.
[vars]
NUITEE_ENV = "production"
