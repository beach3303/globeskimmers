# globeskimmers-site — the public website (globeskimmers.io), served as static
# assets from a Worker. Everything under site/ is uploaded as-is; a small script (site-worker.js)
# passes the API worker's link paths through. Deployed by .github/workflows/deploy-site.yml on every push to
# main that touches site/** or this file.
#
# Custom domains (globeskimmers.io, www.globeskimmers.io) are attached in the
# Cloudflare dashboard: Workers & Pages → globeskimmers-site → Settings →
# Domains & Routes → Add custom domain. Cloudflare writes the DNS records itself;
# the Google Workspace MX and the SPF TXT on the apex are untouched.
#
# No `routes` key on purpose: declaring one makes wrangler overwrite the
# dashboard-managed domains on every deploy. Both domains were attached on
# 2026-09-21, so the workers.dev and preview URLs are switched off below: the
# site answers only on globeskimmers.io (www redirects there via _redirects).
name = "globeskimmers-site"
compatibility_date = "2025-06-01"
workers_dev = false
preview_urls = false

# site-worker.js (2026-10-24) runs only for paths that aren't files under site/: it hands /p/, /m/
# and /go/ to the API worker (the service binding below) and gives everything else to the assets.
main = "site-worker.js"

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[services]]
binding = "API"
service = "globeskimmers-api"
